; Radio Thing firmware. Pin map: include/board_pins.h (fixed contract).
[platformio]
default_envs = pod, display

[esp32_common]
platform = espressif32@6.10.0          ; Arduino-ESP32 2.0.17 / ESP-IDF 4.4
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi   ; N8R8: octal PSRAM
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall -Wextra
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -Iinclude
build_unflags = -std=gnu++11

[env:pod]
extends = esp32_common
build_src_filter = -<*> +<pod/>
build_flags =
    ${esp32_common.build_flags}
    -DRT_ROLE_POD=1

[env:display]
extends = esp32_common
build_src_filter = -<*> +<display/>
build_flags =
    ${esp32_common.build_flags}
    -DRT_ROLE_DISPLAY=1
lib_deps =
    lovyan03/LovyanGFX@1.2.33

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall -Wextra
    -Ilib/core
